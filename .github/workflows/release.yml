name: release-client

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # ----------------------------
      # Generate version v0.0.x
      # ----------------------------
      - name: Generate version
        id: version
        run: |
          git fetch --tags

          LAST_TAG=$(git tag --list "v0.0.*" --sort=-v:refname | head -n 1)

          if [ -z "$LAST_TAG" ]; then
            NEW_VERSION="v0.0.1"
          else
            LAST_NUM=$(echo $LAST_TAG | cut -d '.' -f 3)
            NEW_VERSION="v0.0.$((LAST_NUM + 1))"
          fi

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      # ----------------------------
      # Build CLIENT ONLY
      # ----------------------------
      - name: Build client binaries
        run: |
          mkdir -p dist

          OUT="dist/wormhole-client"

          GOOS=linux GOARCH=amd64 go build -o ${OUT}-linux-amd64 ./cmd/client
          GOOS=linux GOARCH=arm64 go build -o ${OUT}-linux-arm64 ./cmd/client

          GOOS=darwin GOARCH=amd64 go build -o ${OUT}-darwin-amd64 ./cmd/client
          GOOS=darwin GOARCH=arm64 go build -o ${OUT}-darwin-arm64 ./cmd/client

          GOOS=windows GOARCH=amd64 go build -o ${OUT}-windows-amd64.exe ./cmd/client
          GOOS=windows GOARCH=arm64 go build -o ${OUT}-windows-arm64.exe ./cmd/client

      # ----------------------------
      # Create GitHub Release
      # ----------------------------
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: dist/*